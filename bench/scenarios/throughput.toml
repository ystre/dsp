# Maximum throughput (closed loop, sink): how many messages/bytes per second the
# server absorbs, and at what CPU cost per message. Swept over message sizes.
# Needs the Phase 2 load generator (multiple connections and threads).

[[scenario]]
name        = "throughput-64B"
description = "Sink, 64 B payloads, 64 connections on 8 threads, pipeline 64."
duration_s  = 60
warmup_s    = 10
repeat      = 3

[scenario.loadgen]
type        = "data"
payload     = "fixed:64"
connections = 64
threads     = 8
batch       = 64

[scenario.local]
server_cpus  = "0-3"
loadgen_cpus = "4-11"

[scenario.thresholds]
"throughput.messages_per_s" = 0.05
"server.ns_per_message"     = 0.05

