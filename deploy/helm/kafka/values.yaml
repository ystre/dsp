# Kafka chart values (doc/deployment.adoc, "Kafka chart").
#
# A KRaft cluster. Used twice: as the platform's shared cluster (dependencies
# chart) and, optionally, as a release's dedicated cluster (integration chart,
# for benchmarks of a Kafka sink without neighbours). Needs the Strimzi operator
# watching its namespace (the dependencies chart installs it cluster-wide). Not
# used by the server yet (no northbound sink).

name: kafka
version: 4.3.1
replicas: 1
# Single node: combined controller + broker; replication factor 1.
roles: [controller, broker]
storage:
  size: 20Gi
  deleteClaim: true
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 4Gi
heap: 1g
partitions: 12
config: {}
# Strimzi Metrics Reporter: the metric families exported (regular expressions
# on the Prometheus names). Each family costs series per topic or partition on
# a busy cluster; these are what the Strimzi Kafka and KRaft dashboards use
# (the dependencies chart's dashboards/kafka).
metrics:
  allowList:
    - "kafka_server_brokertopicmetrics.*"
    - "kafka_network_requestmetrics.*"
    - "kafka_network_socketserver.*"
    - "kafka_server_replicamanager.*"
    - "kafka_log_log.*"
    - "kafka_controller.*"
    - "kafka_cluster_partition.*"
    - "kafka_server_kafkarequesthandlerpool.*"
    - "kafka_server_kafkaserver.*"
    - "kafka_server_socket_server_metrics.*"
    - "kafka_server_raft.*"
kafkaExporter:
  enabled: true
  topicRegex: ".*"
  groupRegex: ".*"
podMonitor:
  enabled: true
  interval: 5s

# Every pod of the cluster (brokers and controllers, entity operator, Kafka
# exporter), through Strimzi's pod templates. Strimzi has no nodeSelector: it
# becomes required node affinity, added to `affinity`'s terms.
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
