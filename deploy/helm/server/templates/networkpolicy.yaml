{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "server.fullname" . }}
  labels:
    {{- include "server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        {{- if .Values.ports.tcp.enabled }}
        - port: {{ .Values.ports.tcp.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.ports.udp.enabled }}
        - port: {{ .Values.ports.udp.port }}
          protocol: UDP
        {{- end }}
        {{- if .Values.ports.ws.enabled }}
        - port: {{ .Values.ports.ws.port }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.dataFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: {{ .Values.ports.admin.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.adminFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
