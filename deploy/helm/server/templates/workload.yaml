{{- $sts := eq .Values.workload.kind "StatefulSet" -}}
apiVersion: apps/v1
kind: {{ .Values.workload.kind }}
metadata:
  name: {{ include "server.fullname" . }}
  labels:
    {{- include "server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.workload.replicas }}
  {{- end }}
  {{- if $sts }}
  serviceName: {{ include "server.fullname" . }}-headless
  podManagementPolicy: {{ .Values.workload.podManagementPolicy }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.config.enabled }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "server.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.workload.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.performance.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.performance.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.performance.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- with .Values.performance.sysctls }}
        sysctls:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      containers:
        - name: server
          image: {{ include "server.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/{{ .Values.binaries.server }}"]
          args:
            - --port
            - {{ .Values.ports.tcp.port | quote }}
            - --admin-port
            - {{ .Values.ports.admin.port | quote }}
            {{- if .Values.config.enabled }}
            - --config
            - {{ .Values.config.mountPath }}/config.yaml
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if .Values.ports.tcp.enabled }}
            - name: tcp
              containerPort: {{ .Values.ports.tcp.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.ports.udp.enabled }}
            - name: udp
              containerPort: {{ .Values.ports.udp.port }}
              protocol: UDP
            {{- end }}
            {{- if .Values.ports.ws.enabled }}
            - name: ws
              containerPort: {{ .Values.ports.ws.port }}
              protocol: TCP
            {{- end }}
            - name: admin
              containerPort: {{ .Values.ports.admin.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- include "server.resources" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- if .Values.config.enabled }}
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.performance.hugepages2Mi }}
            - name: hugepages
              mountPath: /hugepages
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.config.enabled }}
        - name: config
          configMap:
            name: {{ include "server.fullname" . }}
        {{- end }}
        {{- if .Values.performance.hugepages2Mi }}
        - name: hugepages
          emptyDir:
            medium: HugePages-2Mi
        {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
