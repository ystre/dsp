{{- if and .Values.tests.enabled .Values.ports.tcp.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "server.fullname" . }}-test-echo
  labels:
    {{- include "server.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: loadgen
      image: {{ include "server.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["/usr/local/bin/{{ .Values.binaries.loadgen }}"]
      args:
        - --target
        - {{ printf "%s:%d" (include "server.fullname" .) (int .Values.ports.tcp.port) | quote }}
        - --type
        - echo
        - --count
        - {{ .Values.tests.count | quote }}
        - --scenario
        - helm-test
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          memory: 128Mi
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
{{- end }}
