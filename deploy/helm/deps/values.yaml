# Dependencies chart values (doc/deployment.adoc, "Dependencies chart").
#
# The platform: cluster-wide operators and the shared observability stack,
# installed once per cluster (deploy/lab/platform.sh), never per release. On a
# cluster that already runs Prometheus/Grafana or Strimzi, disable the
# corresponding subchart: CRDs are cluster-scoped and owned by exactly one Helm
# release. Per-release resources (the server's monitors, a Kafka cluster) live
# in the integration chart.

# ------------------------------------------------------------------------------
# Observability: Prometheus Operator, Prometheus, Grafana, node-exporter,
# kube-state-metrics. Tuned for a single-node benchmark lab (values from o1).
# ------------------------------------------------------------------------------
kube-prometheus-stack:
  enabled: true
  alertmanager:
    enabled: false
  # Linux nodes only: no AIX/macOS dashboards.
  nodeExporter:
    operatingSystems:
      aix:
        enabled: false
      darwin:
        enabled: false
  # k3s embeds these components; they cannot be scraped and would only show up as "down".
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  prometheus:
    prometheusSpec:
      # Benchmark runs last minutes; a 5 s scrape keeps enough points per run.
      scrapeInterval: 5s
      evaluationInterval: 15s
      retention: 2d
      retentionSize: 5GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi
      # Pick up PodMonitors/ServiceMonitors/rules from every namespace, regardless of Helm labels.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
  prometheus-node-exporter:
    extraArgs:
      # The counters of the server dashboard's "Node" row and of Node Exporter Full.
      - --collector.netstat.fields=^(.*_(InErrors|InErrs|RcvbufErrors|SndbufErrors)|Icmp6?_(InMsgs|OutMsgs)|Ip(6|Ext)_(InOctets|OutOctets)|Ip_Forwarding|Tcp_(ActiveOpens|PassiveOpens|RetransSegs|CurrEstab|InSegs|OutSegs|OutRsts|MaxConn)|TcpExt_(Listen.*|Syncookies.*|TCPTimeouts|TCPSynRetrans|TCPOFOQueue|TCPRcvQDrop)|Udp(6|Lite)?_(InDatagrams|OutDatagrams|NoPorts))$
      # Off by default, cheap, and on Node Exporter Full: process/thread counts and limits,
      # TCP connections per state.
      - --collector.processes
      - --collector.tcpstat
  grafana:
    adminUser: admin
    adminPassword: lab
    service:
      type: NodePort
      nodePort: 30300
    grafana.ini:
      auth.anonymous:
        enabled: true
        org_role: Viewer
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true

# ------------------------------------------------------------------------------
# Kafka: the Strimzi operator (watching every namespace, so a release can also
# have a dedicated cluster: the integration chart's `kafka` component) and the
# shared Kafka cluster. Releases declare their topics on it (KafkaTopic in this
# namespace, names prefixed per release namespace; the integration chart's
# `topics`).
# ------------------------------------------------------------------------------
strimzi-kafka-operator:
  enabled: true
  watchAnyNamespace: true
  resources:
    requests:
      cpu: 100m
      memory: 384Mi

# The shared cluster (deploy/helm/kafka; every option of its values.yaml).
kafka:
  enabled: true

# ------------------------------------------------------------------------------
# Dashboards and monitors of the platform itself (besides those of
# kube-prometheus-stack). Third-party dashboards are vendored, pinned, by
# deploy/grafana/fetch-dashboards.sh into dashboards/<folder>/.
# ------------------------------------------------------------------------------
dashboards:
  enabled: true
  # Label the Grafana dashboard sidecar watches.
  label: grafana_dashboard
  labelValue: "1"
  # dashboards/<folder> -> Grafana folder; "" leaves the folder's dashboards out.
  folders:
    # Strimzi: Kafka and KRaft (Metrics Reporter), Kafka exporter, operators.
    kafka: Kafka
    # Node Exporter Full (grafana.com 1860): every node-exporter metric, per node.
    nodes: Nodes

monitoring:
  # PodMonitor of the Strimzi cluster operator (with strimzi-kafka-operator).
  strimziOperator:
    enabled: true
    interval: 15s
